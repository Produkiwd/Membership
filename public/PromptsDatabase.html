rom [book title] and explain how each could be applied in a real-world business scenario."'},{title:"CASE STUDIES",colorClass:"bg-brand-dark",desc:"Real-world case studies help bridge the gap between theory and practice. AI can help extract the most valuable lessons.",prompt:`"Identify any case studies presented in [book title]. Summarize their key points and explain how they support the book's overall message."`},{title:"BOOK COMPARISON",colorClass:"bg-brand-dark",desc:"Comparing books can reveal new insights. AI can help draw meaningful connections faster than you could on your own.",prompt:'"Compare and contrast the key principles in [book title] with those in [another relevant book]. What are the similarities and differences? How do they complement or contradict each other?"'},{title:"EXPLAIN TO DIFFERENT AUDIENCES",colorClass:"bg-brand-dark",desc:"Explaining complex ideas at different levels of difficulty improves understanding.",prompt:'"In [book title], the author discusses [concept]. Explain this concept as if you were teaching:\\na) A high school student\\nb) A seasoned CEO\\nc) A student considering a career in this field\\nHow does the explanation differ for each audience?"'},{title:"APPLY TO DIFFERENT BUSINESSES",colorClass:"bg-brand-dark",desc:"AI can help you reimagine how ideas might work in different business contexts.",prompt:`"Imagine you're implementing the strategies from [book title] in:\\na) A tech startup\\nb) A family-owned restaurant\\nc) A large multinational corporation\\nWhat would be the specific challenges and opportunities in each scenario?"`},{title:"USE FRAMEWORKS",colorClass:"bg-brand-dark",desc:"Extract the frameworks discussed in a book and apply them to your own situation.",prompt:'"In [book title], the author presents [specific framework or model]. Apply this framework to analyze:\\na) A recent business success story\\nb) A notable business failure\\nWhat insights does this analysis provide?"'},{title:"CREATE ACTION PLAN",colorClass:"bg-brand-dark",desc:"Turning theory into practice can be tough. AI can help break ideas into actionable steps, making implementation easier.",prompt:'"Based on the principles outlined in [book title], create a hypothetical 30-day action plan for a business leader looking to implement these ideas."'},{title:"POTENTIAL WEAKNESSES",colorClass:"bg-brand-dark",desc:"Truly understanding a concept means recognizing where it might fall or have limitations.",prompt:'"What are the potential criticisms or limitations of the ideas presented in [book title]? How might these be addressed?"'},{title:"MAIN IDEA",colorClass:"bg-brand-dark",desc:"AI is great at summarizing a book's core message, helping you focus on the big picture.",prompt:'"Summarize the main thesis of [book title] in one sentence, then expand on how this central idea is developed throughout the book."'},{title:"ANALYZE QUOTES",colorClass:"bg-brand-dark",desc:"Memorable quotes help reinforce a book's key messages. AI can identify and analyze them.",prompt:'"Extract 3-5 memorable quotes from [book title]. For each quote, explain its context, significance, and how it encapsulates a key lesson from the book."'}],RA=[{title:"EXPLAIN LIKE I'M 5",colorClass:"bg-brand-dark",desc:"Break down tough ideas so even a kid could get it. Perfect for when you're totally lost on a topic.",prompt:'"Explain [insert concept or topic] as if you were talking to a 5-year-old child. Use simple language and everyday examples."'},{title:"EXAMPLES AND ANALOGIES",colorClass:"bg-brand-dark",desc:"Get real-world examples that make abstract ideas click.",prompt:'"Explain [insert concept or topic] using three different real-world examples or analogies that would be easy for a beginner to understand."'},{title:"MOTIVATION",colorClass:"bg-brand-dark",desc:"Get tips to keep yourself motivated about learning, even when it gets tough.",prompt:`"I'm struggling to stay motivated while learning [insert subject or skill]. Provide me with 5 practical strategies to boost my motivation and maintain consistency in my studies."`},{title:"ROLE-PLAY",colorClass:"bg-brand-dark",desc:"Act out scenarios to practice what you've learned.",prompt:`"Let's role-play a scenario where I'm [insert role] and you're [insert another role]. We'll practice [insert skill or situation]. Begin the scenario, and I'll respond accordingly."`},{title:"STUDY PLAN",colorClass:"bg-brand-dark",desc:"Map out your learning journey from start to finish. Great for tackling big subjects without getting overwhelmed.",prompt:'"Create a detailed study plan for learning [insert subject or skill] over the course of [insert time frame]. Include specific goals, resources, and milestones."'},{title:"QUIZ",colorClass:"bg-brand-dark",desc:"Create some practice questions to see if you've really got the hang of things.",prompt:'"Generate a 10-question quiz on [insert topic], including a mix of multiple-choice, true/false, and short-answer questions. Provide answers and brief explanations for each question."'},{title:"MINDMAP",colorClass:"bg-brand-dark",desc:"Sketch out your thoughts to see how everything connects. Really helpful when you're trying to wrap your head around a big topic.",prompt:'"Create a detailed mind map for the topic [insert topic]. Include main branches, sub-branches, and key concepts or ideas for each."'},{title:"EXPERT ROUNDTABLE",colorClass:"bg-brand-dark",desc:"Simulate a discussion between people who really know their stuff. Great for getting different views on tricky topics.",prompt:'"Simulate a roundtable discussion with me and three experts in [insert field] discussing [insert topic or question]. Present their different viewpoints and any potential areas of agreement or disagreement."'},{title:"MENTAL ASSOCIATIONS",colorClass:"bg-brand-dark",desc:"Come up with clever memory tricks to help stuff stick in your brain. Useful for remembering lists, facts, or tricky concepts.",prompt:'"Help me create mental associations or mnemonic device rge Siemens",theoryDesc:"Di era digital, pembelajaran bukan sekadar konstruksi pengetahuan internal, melainkan tentang mengenali pola dan membangun koneksi antar informasi dari berbagai sumber lintas domain.",tactic:"Buat ruang belajar dengan berbagai materi acak. Minta AI bertindak sebagai mesin konektivis — memetakan hubungan antar domain dan merapikannya secara struktural dalam waktu singkat.",samplePrompt:"Act as a strategic advisor. Synthesize these sources to find three unexpected connections between [Concept A] and [Concept B]. Provide citations.",problem:"Informasi berhasil diserap namun tersebar dan tidak terorganisir.",solution:"Mengubah materi yang berserakan menjadi poin-poin terstruktur melalui proses chunking (pengelompokan).",impact:"Materi menjadi terorganisir rapi, mudah dipelajari, dan siap untuk dipresentasikan.",workflow:["Gunakan materi yang sudah ada di dalam ruang kerja AI","Minta AI menyusunnya menjadi 10 poin utama atau sebuah outline","Simpan output yang terstruktur sebagai Catatan","Buat Mind Map untuk memvisualisasikan koneksi antar konsep"],quickWin:"Materi yang super berantakan menjadi outline super rapi dalam waktu kurang dari 10 menit."},{id:3,tag:"0 → 1",num:"03",title:"Spark New Ideas",subtitle:"Beat the Blank Page",theory:"Constructivism",theorist:"Piaget & Vygotsky",theoryDesc:"Pembelajar secara aktif membangun (mengkonstruksi) pemahaman dengan mengalami berbagai hal dan merefleksikannya, membangun di atas skema kognitif yang telah ada.",tactic:"Gunakan Active Reading: tuliskan pemikiran, refleksi, atau hipotesis awal Anda pada kolom chat AI. Lalu minta AI untuk memeriksa interpretasi tersebut berdasarkan teks sumber aslinya.",samplePrompt:"Based on the text, is my interpretation here accurate? What evidence supports or contradicts my thought?",problem:"Kesulitan atau nge-blank (stuck) saat harus memulai proses kreatif dari layah putih.",solution:"Menjadikan AI sebagai partner brainstorming yang pandangannya tertambat pada dokumen yang kita tuju.",impact:"Mendapatkan banyak inspirasi dan ide segar serta pijakan awal yang tajam.",workflow:["Upload satu dokumen utama sebagai jangkar (silabus, brief, artikel)","Lakukan curah pendapat (brainstorming) ide/sudut pandang dengan AI","Simpan ide-ide menarik sebagai Catatan Baru","Kembangkan catatan tersebut menjadi outline melalui format FAQ"],quickWin:"Dalam waktu 5 menit sesi brainstorming dengan AI, Anda akan menumpas 'blank page syndrome'."},{id:4,tag:"100 → 100+",num:"04",title:"Deep Mastery",subtitle:"From Learner to Expert",theory:"Elaborative Interrogation",theorist:"Feynman Technique",theoryDesc:"Pembelajaran aktif melalui pertanyaan 'Mengapa?' dan 'Bagaimana?' mengintegrasikan fakta baru dengan pengetahuan dasar. Ini pergeseran dari membaca pasif menjadi menjelaskan secara aktif — pondasi menuuju ahli.",tactic:"Upload konsep/framework yang Anda miliki, lalu gunakan AI sebagai Socratic sparring partner (rekan debat). Minta AI untuk mengkritisi asumsi yang ada, dan paksa diri Anda untuk menjawab tantangan tersebut.",samplePrompt:"Review my uploaded framework. Ask me one deep, challenging question about the underlying assumptions of this model, and wait for my answer.",problem:"Pemahaman masih terasa berada di permukaan, sering luput menghadapi skenario di luar materi.",solution:"Memperdalam tingkat pemahaman hingga selevel pakar melalui pola Socratic dialog.",impact:"Mampu menjawab pertanyaan fundamental dengan sangat meyakinkan dan lebih percaya diri.",workflow:["Pastikan seluruh materi suatu topik sudah berada di dalam sistem","Minta AI mengajukan pertanyaan fundamental (pertanyaan 'why', 'what if')","Simpan analogi dan jawaban krusial Anda menjadi Catatan pemahaman utuh","Kembangkan menjadi Study Guide berserta kumpulan flashcard-nya"],quickWin:"Dalam 3-4 pertanyaan pengujian kritis, temukan sisi gelap pemahaman yang tidak Anda sadari sebelumnya."},{id:5,tag:"10 → 10+",num:"05",title:"Accelerate Your Research",subtitle:"Synthesize & Discov
