Contoh:
[Fakta]: Biaya lisensi database melonjak 40%.
[Dampak]: Margin operasional Q3 tertekan 2.1%.
[Rekomendasi]: Evaluasi migrasi open-source database dalam 6 bulan.

Sekarang buat ringkasan situasi berikut dengan struktur yang sama persis:
[Fakta]: Tingkat turnover staf software engineer mencapai 25% tahun ini.`},{id:"few-shot",title:"Few-Shot Prompting",tag:"Pattern Locking",steps:["Identify Query & Desired Response Style","Provide Multiple Relevant Examples (2-5)","Send Prompt & Examples to LLM","LLM Recognizes Patterns from Examples","Generates Response Following Established Pattern","Final Contextualized Output Delivered"],desc:"Few-shot prompting involves providing 2–5 structured examples. This locks in classification rules, nuances, and specific styling without needing complex abstract rules.",example:`Klasifikasikan sentimen umpan balik nasabah dan tentukan mitigasinya:

Contoh 1:
Input: 'Aplikasi sering crash saat transaksi tanggal 25.'
Kategori: Kritis (Bug Finansial)
Mitigasi: Eskalasi Tim DevOps P1 & refund biaya admin jika ada gagal bayar.

Contoh 2:
Input: 'Warna tombol konfirmasi kurang kontras di layar malam.'
Kategori: Minor (UI/UX)
Mitigasi: Masukkan ke backlog sprint desain UI bulan depan.

Sekarang klasifikasikan input berikut:
Input: 'Saldo terpotong dua kali pada saat pembayaran QRIS di kasir supermarket.'`},{id:"cot",title:"Chain-of-Thought (CoT) Prompting",tag:"Logic & Reasoning",steps:["Identify Complex Problem",'Instruct LLM Explicitly ("Think step-by-step")',"Send Step-by-step Prompt","LLM Performs Incremental Reasoning","Provides Detailed Intermediate Steps","Reaches Logical Conclusion","Complete Answer Delivered"],desc:"Chain-of-thought prompting explicitly instructs the LLM to perform incremental reasoning before answering. This cuts hallucination rates significantly on complex math, logic, or policy trade-offs.",example:`Sebelum memberikan rekomendasi investasi pada proyek otomatisasi pergudangan senilai Rp 5 Miliar, uraikan proses berpikir Anda tahap demi tahap:

Langkah 1: Hitung Payback Period dan ROI kasar berdasarkan asumsi efisiensi biaya lembur Rp 1.5 Miliar/tahun.
Langkah 2: Evaluasi risiko teknis integrasi dengan legacy ERP yang sudah berusia 8 tahun.
Langkah 3: Rumuskan 2 alternatif mitigasi kegagalan adopsi di lapangan.
Kesimpulan & Rekomendasi Final:`},{id:"self-consistency",title:"Self-Consistency Prompting",tag:"Multi-Path Consensus",steps:["Clearly Define Query & Desired Reasoning","Send Prompt to LLM (Multiple Generations)","LLM Generates Multiple Reasoning Paths","Evaluate Multiple Outputs for Consistency","Select Most Consistent Answer","Final Verified Answer Provided"],desc:"Self-consistency involves generating multiple divergent reasoning paths for the same problem, then selecting the answer supported by consensus. Highly effective for mission-critical decisions.",example:`Evaluasi strategi penetapan harga langganan B2B ini melalui 3 sudut pandang penalaran yang independen:
Jalur A: Analisis elastisitas harga dan willingness-to-pay segmen enterprise.
Jalur B: Analisis margin kontribusi per akun (CAC vs LTV 3 tahun).
Jalur C: Analisis respon kompetitif dari incumbent market leader.

Bandingkan kesimpulan ketiganya, temukan titik temu paling kokoh, dan berikan harga akhir yang paling aman bagi cashflow.`},{id:"role-based",title:"Role-Based Prompting",tag:"Expert Persona",steps:["Choose Desired Role/Persona","Craft Prompt Clearly Defining the Role","Send Role-based Prompt to LLM","LLM Adopts Specified Role","Generates Response Aligned with Expertise","Role-Specific Output Delivered"],desc:"Role-based prompting instructs the model to embody a world-class specialist persona, anchoring the vocabulary, analytical depth, and perspective to that specific professional domain.",example:"Bertindaklah sebagai Chief Risk Officer (CRO) perbankan tier-1 dengan pengalaman 20 tahun dalam audit kepatuhan regulasi OJK dan Basel III. Review ringkasan arsitektur cloud data nasabah ini dan soroti 3 celah kepatuhan paling rentan terhadap sanksi hukum."},{id:"instruction-tuning",title:"Instruction Tuning (Task-Specific Constraints)",tag:"Precision Control",steps:["Identify Specific Task Requirements","Prepare Detailed Task-specific Instructions","Include Instructions Explicitly in Prompt","Send Clearly Structured Prompt","LLM Precisely Follows Provided Instructions","Generates Task-specific Output","Final Output Delivered"],desc:"Instruction tuning explicitly bounds the model with strict formatting, negative constraints (what NOT to do), and structural guardrails for reproducible business automation.",example:`Instruksi Khusus & Batasan Ketat:
1. Ekstrak hanya entitas: [Nama Mitra], [Nilai Kontrak], [Masa Berlaku], [Penalti Keterlambatan].
2. Tampilkan dalam tabel Markdown 4 kolom.
3. Jika informasi penalti tidak disebutkan di dokumen, tulis 'TIDAK DICANTUMKAN' (DILARANG MENGARANG/HALUSINASI).
4. Dilarang menambahkan kata pengantar atau salam penutup. Hanya keluarkan tabel Markdown.`},{id:"react",title:"ReAct (Reasoning + Action) Prompting",tag:"Autonomous Agentic",steps:["Clearly State Query Requiring External Info","Send Prompt with Action Permissions","LLM Reasons to Identify Required Actions","LLM Initiates Appropriate External Action","Receives & Processes External Data","Continues Reasoning with Context","Final, Fully-informed Answer"],desc:"ReAct combines verbal reasoning traces ('Thought') with task-specific actions ('Action') and feedback observation ('Observation') to ground LLM outputs in real-time verified facts.",example:`Terapkan siklus ReAct (Thought -> Action -> Observation -> Final Answer):

Thought 1: Saya perlu mengecek apakah regulasi batas upah minimum provinsi (UMP) 2025 telah diterbitkan secara resmi.
Action 1: [Search / Query Dokumen Regulasi UMP 2025]
Observation 1: Peraturan Gubernur diterbitkan dengan kenaikan 6.5%.
Thought 2: Sekarang saya harus menghitung dampak kenaikan ini terhadap pos anggaran biaya operasional pabrik.
Final Answer: Ringkasan dampak kenaikan UMP 6.5% beserta 2 strategi rasionalisasi shift kerja.`}],tl={problem:{title:'THE PROBLEM: THE "HELPFULNESS" & POLITENESS BIAS',points:[{title:"AI Dilatih untuk Melindungi Ego Pengguna",desc:"Secara default, model AI dioptimasi melalui RLHF (Reinforcement Learning from Human Feedback) untuk bersikap ramah, suportif, dan menyenangkan. Akibatnya, AI cenderung memberikan validasi palsu atau pujian sopan terhadap proposal bisnis yang sebetulnya rapuh."},{title:"Kebutuhan Keputusan High-Stakes",desc:"Untuk proposal tender dewan direksi, peluncuran produk baru, penawaran merger, atau mitigasi audit hukum, feedback sopan sangat berbahaya. Anda membutuhkan kritik kejam tanpa ampun sebelum pasar atau kompetitor menghukum Anda."}]},framework:[{num:"1",title:"Begin Fresh: Kill the Memory",desc:"Gunakan 'Temporary Chat' (ChatGPT, Gemini) atau 'Incognito/Ghost Mode' (Claude) agar model tidak mengingat riwayat preferensi Anda yang membuat AI berusaha menyenangkan Anda."},{num:"2",title:"Right Model Selection",desc:"Untuk keputusan bernilai tinggi, uji dokumen Anda ke 2-3 model berbeda. Grok/DeepSeek cenderung lebih lugas dan blak-blakan, sementara ChatGPT/Claude memerlukan dorongan persona kritis."},{num:"3",title:"Use a Critic Persona",desc:"Tugaskan peran pengkritik tanpa kompromi: Devil's Advocate, Auditor Forensik Skeptis, atau Investor Kejam ala Shark Tank yang bertujuan membantai asumsi proposal Anda."},{num:"4",title:"Third-Party Framing",desc:"Lepaskan identitas Anda dari materi tersebut. Katakan: 'Ini adalah draf dari kompetitor kita / kolega lain'. Trik psikologis ini membebaskan AI dari rasa enggan menyakiti perasaan Anda."},{num:"5",title:"Ask Specific Risk Questions",desc:"Ganti pertanyaan 'Bagaimana menurutmu?' dengan pertanyaan berdaya rusak tinggi: 'Lakukan pre-mortem: sebutkan 3 alasan paling fatal mengapa inisiatif ini akan gagal total dalam 90 hari.'"},{num:"6",title:"Leverage AI Against Itself (AI Jiu-Jitsu)",desc:"Minta AI memberi nilai 1-100 pada kekejaman kritiknya. Lalu perintahkan: 'Kritik di atas masih terlalu sopan. Tingkatkan skor ketajamannya menjadi 95/100 dan bongkar lubang logika terdalam!'"}],modelSpectrum:[{name:"Grok & DeepSeek",badge:"Honest & Blunt",desc:"Cenderung sangat objektif, blak-blakan, tidak segan menolak premis yang salah, dan minim basa-basi kesopanan."},{name:"Gemini",badge:"Supportive / Explorative",desc:"Sangat unggul dalam sintesis multi-dokumen panjang dan riset, namun membutuhkan perintah eksplisit agar mau mengkritik tajam."},{name:"ChatGPT & Claude",badge:"Ego-Protective by Default",desc:"Sangat santun dan diplomatis secara default. Sangat membutuhkan framing pihak ketiga atau persona Red Teaming agar tidak memuji-muji draf yang lemah."}],systemLevelBonus:{desc:"Gunakan pengaturan personalisasi profil untuk menetapkan instruksi permanen:",prompt:"Prioritize substance over compliments; challenge assumptions relentlessly; never soften criticism to make me feel comfortable; act as an unapologetic Red Team auditor."}},os={templates:[{title:"Prompt Optimizer Meta-Prompt",desc:"Alternatif gratis untuk tools optimasi prompt berbayar. AI bertindak sebagai prompt engineer elit yang me-rewrite prompt awal Anda.",prompt:`You are an expert prompt engineer specializing in creating prompts for AI language models, particularly [model]. Your task is to take my prompt and transform it into a well-crafted and effective prompt that will elicit optimal responses. Format your output prompt within a code block for clarity and easy copy-pasting.

## Here's my initial prompt:
[paste your prompt here]`},{title:"XML Sandwich Template",desc:"Meningkatkan presisi model dengan memisahkan komponen instruksi ke dalam tag XML terisolasi.",prompt:`<context>
[Berikan latar belakang, siapa Anda, industri bisnis, dan kondisi yang dihadapi]
</context>

<task>
[Jelaskan instruksi spesifik apa yang harus dilakukan AI menggunakan action verbs]
</task>

<rules>
1. Gunakan nada asertif dan profesional.
2. Buat tabel 3 kolom untuk temuan risiko.
3. Jangan membuat asumsi di luar fakta yang disediakan.
</rules>

<example>
[Berikan contoh output target yang ideal]
</example>`},{title:"Universal Perfection Loop",desc:"Perintahkan AI untuk membangun rubrik penilaian internal dan mengiterasi drafnya secara mandiri sampai bernilai 10/10 sebelum menjawab.",prompt:"Before you respond, create an internal rubric for what defines a 'world-class, 10/10' answer to my request. Then internally iterate on your work until it scores 10/10 against that rubric, and show me only the final, perfect output."},{title:"Router Nudge Phrases",desc:"Frasa tambahan di akhir prompt untuk memicu alokasi komputasi reasoning mendalam pada model berpikir tingkat tinggi.",prompt:`Tambahkan salah satu frasa ini di baris penutup prompt Anda:
- "Think hard about this."
- "Think deeply and consider edge cases before answering."
- "Evaluate hidden trade-offs carefully."`},{title:"Verbosity Control Phrases",desc:"Mengontrol panjang teks keluaran secara presisi agar tidak terlalu dangkal maupun bertele-tele.",prompt:`- Low Verbosity: "Give me the bottom line in 100 words or less, use markdown bullets for high scanability."
- Medium Verbosity: "Aim for a concise 3-5 paragraph explanation with clear section headers."
- High Verbosity: "Provide a comprehensive and detailed breakdown (600–800 words) with step-by-step rationales."`}],buildingBlocks:[{title:"1. Task",desc:"Komponen paling krusial. Selalu mulai dengan action verb eksplisit: generate, write, analyze, audit, synthesize."},{title:"2. Context",desc:"Jawab 3 hal penting: latar belakang situasi, kriteria sukses ('what success looks like'), dan lingkungan kerja."},{title:"3. Exemplars",desc:"Berikan 1–3 contoh konkret dari output yang diinginkan untuk mengunci gaya dan format."},{title:"4. Persona",desc:"Definisikan peran spesifik: 'Senior Procurement Director', 'Forensic Auditor', dll."},{title:"5. Format",desc:"Visualisasikan bentuk output: tabel Markdown, memo Minto Pyramid, email eksekutif, atau JSON."},{title:"6. Tone",desc:"Tentukan nada bicara: objektif, lugas tanpa basa-basi, asertif, atau diplomatik persuasif."}],bestPractices:[{title:"Router Nudge Phrases",desc:"Gunakan untuk memaksa higher reasoning model berjalan pada model reasoning (o1, o3, Gemini Thinking)."},{title:"Verbosity Control",desc:"Kontrol panjang konten karena model dapat kelebihan atau kekurangan kata tanpa arahan spesifik."},{title:"Prompt Optimizer Meta-Prompt",desc:"Gunakan AI untuk mengaudit dan me-rewrite instruksi buatan Anda sendiri."},{title:"XML Sandwich",desc:"Gunakan tag <task>, <context>, <rules> supaya model lebih presisi membaca instruksi panjang."},{title:"Perfection Loop",desc:"Gunakan rubrik internal AI untuk menilai kualitas output dirinya sendiri sampai mencapai skor 10/10."}],mistakes:[{title:"1. Overly Specific Custom Instructions",desc:"Terlalu detail justru membatasi keluwesan model. Cantumkan intinya saja: preferensi, tone, dan format."},{title:"2. Tidak Memanfaatkan untuk Otomasi",desc:"AI bisa membantu menulis kode, formula Excel rumit, atau skrip automasi tanpa Anda harus menguasai pemrograman."},{title:"3. The First-try Fallacy",desc:"Jangan harapkan kesempurnaan langsung di percobaan pertama. Minta AI mengajukan pertanyaan klarifikasi terlebih dahulu."},{title:"4. The Summary-only Shortfall",desc:"Jangan sekadar meminta rangkuman biasa. Minta actionable insights dan implikasi strategis bisnis."},{title:"5. Prompt Overload Paradox",desc:"Fokus menguasai 3–5 formula prinsipil yang bisa diadaptasi daripada menyimpan ribuan prompt yang jarang dipakai."}]},yp=[{id:1,tag:"100 → 1",num:"01",title:"Get the Gist Instantly",subtitle:"Big Picture First (Memahami Intisari Utama)",theory:"Cognitive Load Theory",theorist:"John Sweller",theoryDesc:"Kapasitas memori kerja manusia sangat terbatas. Pembelajaran efektif membutuhkan pengelolaan beban kognitif dengan meminimalisir gangguan (extraneous load) dan memaksimalkan skema pemahaman konseptual (germane load).",tactic:"Sebelum membaca teks mentah secara mendetail, gunakan AI untuk membuat Briefing Docs dan Study Guides otomatis. Ini memberikan peta struktural awal yang secara drastis mengurangi beban kognitif dan membebaskan pikiran Anda untuk menganalisis konsep.",samplePrompt:"What is the single most important concept that connects all of these materials? Explain in one paragraph.",problem:"Terlalu banyak materi dan dokumen tebal, tidak tahu harus mulai dari mana.",solution:"Mengubah tumpukan konten menjadi satu pemahaman inti (core understanding) yang mudah dicerna.",impact:"Memahami gambaran besar dengan cepat, memberikan arah pembelajaran yang lebih terfokus.",workflow:["Upload semua materi — slides, PDFs, artikel, transkrip","Minta AI menemukan satu konsep pemersatu utamanya","Simpan jawaban sebagai Catatan — ini menjadi peta belajar Anda","Gunakan Audio Overview untuk mencerna materi dengan mendengarkan"],quickWin:"Dalam 5 menit, dapatkan peta utuh tanpa harus membaca seluruh tumpukan halaman terlebih dahulu."},{id:2,tag:"100 → 10",num:"02",title:"Create Structured Outlines",subtitle:"Organize & Chunk (Mendekonstruksi Dokumen)",theory:"Connectivism",theorist:"George Siemens",theoryDesc:"Di era digital, pembelajaran bukan sekadar konstruksi pengetahuan internal, melainkan tentang mengenali pola dan membangun koneksi antar informasi dari berbagai sumber lintas domain.",tactic:"Kumpulkan materi acak lintas sumber. Minta AI bertindak sebagai mesin konektivis — memetakan hubungan antar domain dan merapikannya secara struktural dalam matriks keputusan.",samplePrompt:"Act as a strategic advisor. Synthesize these sources to find three unexpected connections between [Concept A] and [Concept B]. Provide citations.",problem:"Informasi berhasil diserap namun tersebar berantakan dan tidak terorganisir.",solution:"Mengubah materi yang berserakan menjadi poin-poin terstruktur melalui proses chunking (pengelompokan).",impact:"Materi menjadi terorganisir rapi, mudah dipelajari, dan siap dipresentasikan ke stakeholder.",workflow:["Gunakan materi yang sudah ada di dalam ruang kerja AI","Minta AI menyusunnya menjadi 10 poin utama atau sebuah outline terstruktur","Simpan output yang terstruktur sebagai Catatan","Buat Mind Map untuk memvisualisasikan koneksi antar konsep"],quickWin:"Materi yang super berantakan berubah menjadi outline super rapi dalam waktu kurang dari 10 menit."},{id:3,tag:"0 → 1",num:"03",title:"Spark New Ideas",subtitle:"Beat the Blank Page (Menumpas Sindrom Halaman Kosong)",theory:"Constructivism",theorist:"Piaget & Vygotsky",theoryDesc:"Pembelajar secara aktif membangun (mengkonstruksi) pemahaman dengan mengalami berbagai hal dan merefleksikannya, membangun di atas skema kognitif yang telah ada sebelumnya.",tactic:"Gunakan Active Reading: tuliskan pemikiran, refleksi, atau hipotesis awal Anda pada kolom chat AI. Lalu minta AI untuk memeriksa interpretasi tersebut berdasarkan teks sumber aslinya.",samplePrompt:"Based on the text, is my interpretation here accurate? What evidence supports or contradicts my thought?",problem:"Kesulitan atau mengalami 'blank page syndrome' saat harus memulai proses analisis dari layar putih.",solution:"Menjadikan AI sebagai partner brainstorming yang pandangannya tertambat kuat pada dokumen referensi.",impact:"Mendapatkan banyak inspirasi dan ide segar serta pijakan awal penulisan yang tajam.",workflow:["Upload satu dokumen utama sebagai jangkar (silabus, brief, proposal)","Lakukan curah pendapat (brainstorming) sudut pandang kritis dengan AI","Simpan ide-ide menarik sebagai Catatan Baru","Kembangkan catatan tersebut menjadi draf kerja awal melalui format FAQ"],quickWin:"Dalam waktu 5 menit sesi brainstorming terarah dengan AI, Anda akan menumpas sindrom halaman kosong."},{id:4,tag:"100 → 100+",num:"04",title:"Deep Mastery",subtitle:"From Learner to Expert (Dari Pemula Menjadi Mahir)",theory:"Elaborative Interrogation",theorist:"Feynman Technique",theoryDesc:"Pembelajaran aktif melalui pertanyaan 'Mengapa?' dan 'Bagaimana?' mengintegrasikan fakta baru dengan pengetahuan dasar. Ini pergeseran dari membaca pasif menjadi menjelaskan secara aktif — pondasi utama menuju keahlian sejati.",tactic:"Upload konsep/framework yang Anda miliki, lalu gunakan AI sebagai Socratic sparring partner (rekan debat). Minta AI untuk mengkritisi asumsi Anda, dan paksa diri Anda menjawab tantangan tersebut.",samplePrompt:"Review my uploaded framework. Ask me one deep, challenging question about the underlying assumptions of this model, and wait for my answer.",problem:"Pemahaman masih terasa berada di permukaan, sering gugup saat menghadapi skenario di luar materi teks.",solution:"Memperdalam tingkat pemahaman hingga selevel pakar melalui pola Socratic dialog bertingkat.",impact:"Mampu mempertahankan argumen dan menjawab pertanyaan fundamental stakeholder dengan percaya diri.",workflow:["Pastikan seluruh materi suatu topik sudah berada di dalam sistem","Minta AI mengajukan pertanyaan fundamental (pertanyaan 'why', 'what if')","Simpan analogi dan jawaban krusial Anda menjadi Catatan pemahaman utuh","Kembangkan menjadi Study Guide beserta kumpulan flashcard pengujiannya"],quickWin:"Dalam 3-4 putaran pertanyaan sokratik kritis, temukan blind spot (sisi gelap pemahaman) yang tidak Anda sadari."},{id:5,tag:"10 → 10+",num:"05",title:"Accelerate Your Research",subtitle:"Synthesize & Discover (Sintesis Celah Riset)",theory:"Dual Coding Theory",theorist:"Allan Paivio",theoryDesc:"Manusia jauh lebih mudah memproses dan mengingat informasi jika disampaikan via dua saluran kognitif sekaligus secara berbarengan — visual/tekstual serta auditori.",tactic:"Hasilkan sintesis komprehensif bagi dokumen kompleks Anda. Identifikasi di mana titik konsensus para ahli, titik yang masih diperdebatkan, serta temukan research gap yang belum terjawab.",samplePrompt:"What is the consensus across all these sources? What is still debated? Where is the research gap I could fill?",problem:"Kesulitan menyari atau mensintesis tumpukan sumber riset atau dokumen referensi multi-sumber.",solution:"Sintesis mendalam difasilitasi AI guna memetakan konsensus, perdebatan, dan celah kosong (research gap).",impact:"Penemuan gagasan inovatif baru yang memandu percepatan riset dan pengambilan keputusan strategis.",workflow:["Upload jurnal riset, memo, regulasi, dan berbagai artikel pendukung","Beri instruksi sintesis dan analisis literature gap pada materi rujukan tersebut","Tandai ide hasil sintesis ini dan simpan sebagai referensi terpercaya","Satukan dalam tinjauan komparatif menggunakan format matriks atau timeline"],quickWin:"Buat pemetaan lanskap riset dalam waktu 15 menit, tugas yang biasanya memakan waktu berhari-hari."}],vp=[{title:"Explain Like I'm 5 (ELIF)",author:"Moritz Kremb",desc:"Sederhanakan konsep rumit menjadi penjelasan bahasa awam yang bahkan anak kecil pun bisa paham. Sangat cocok saat Anda baru pertama kali mempelajari domain baru yang asing.",prompt:"Explain [insert concept or topic] as if you were talking to a 5-year-old child. Use simple language, everyday analogies, and avoid technical jargon."},{title:"Examples & Analogies",author:"Moritz Kremb",desc:"Minta contoh konkret di dunia nyata yang membuat ide abstrak langsung 'klik' di kepala.",prompt:"Explain [insert concept or topic] using three different real-world examples or analogies that would be easy for a beginner to understand."},{title:"Motivation & Habit Consistency",author:"Moritz Kremb",desc:"Dapatkan strategi praktis dan tips menjaga motivasi belajar serta disiplin konsistensi saat materi terasa berat.",prompt:"I'm struggling to stay motivated while learning [insert subject or skill]. Provide me with 5 practical strategies to boost my motivation and maintain consistency in my studies."},{title:"Role-Play & Simulation",author:"Moritz Kremb",desc:"Simulasikan interaksi nyata untuk mempraktikkan keterampilan negosiasi, presentasi, atau penanganan konflik.",prompt:"Let's role-play a scenario where I'm [insert your role] and you're [insert counterpart role]. We'll practice [insert skill or situation]. Begin the scenario, and I'll respond accordingly."},{title:"Structured Study Plan",author:"Moritz Kremb",desc:"Petakan kurikulum belajar dari awal hingga akhir dengan target mingguan terukur agar tidak kewalahan.",prompt:"Create a detailed study plan for learning [insert subject or skill] over the course of [insert time frame]. Include specific goals, free resources, weekly milestones, and assessment checkpoints."},{title:"Active Recall Quiz",author:"Moritz Kremb",desc:"Uji pemahaman Anda dengan serangkaian soal latihan variatif untuk menguji apakah Anda benar-benar paham.",prompt:"Generate a 10-question quiz on [insert topic], including a mix of multiple-choice, true/false, and short-answer questions. Provide answers and brief explanations for each question."},{title:"Mindmap & Conceptual Hierarchy",author:"Moritz Kremb",desc:"Petakan hubungan sebab-akibat dan hierarki konsep utama beserta sub-cabangnya untuk melihat gambaran besar.",prompt:"Create a detailed mind map for the topic [insert topic]. Include main branches, sub-branches, and key concepts or ideas for each in a clean indented markdown list."},{title:"Expert Roundtable Discussion",author:"Moritz Kremb",desc:"Simulasikan diskusi meja bundar antara para pakar terkemuka di bidang tertentu untuk mendapatkan multi-perspektif.",prompt:"Simulate a roundtable discussion with me and three experts in [insert field] discussing [insert topic or question]. Present their different viewpoints and any potential areas of agreement or disagreement."},{title:"Mental Associations & Mnemonics",author:"Moritz Kremb",desc:"Buat jembatan keledai dan teknik asosiasi memori agar rumus, istilah asing, atau urutan langkah menempel erat di ingatan.",prompt:"Help me create mental associations or mnemonic devices to remember key information about [insert topic or concept]."},{title:"Improve What You Have (Iterative Polish)",author:"Moritz Kremb",desc:"Dapatkan kritik konstruktif dan rekomendasi revisi spesifik untuk menyempurnakan dokumen draf yang telah Anda buat.",prompt:"Here's something I've [written/created/produced]: [insert your work]. Please provide specific suggestions to improve it, focusing on [aspect you want to improve, e.g., clarity, structure, persuasiveness]. Explain why each change would make it better."}],jp=[{title:"Key Takeaways & Core Lessons",desc:"Buku bisnis sering kali memuat banyak cerita pendukung. AI membantu menyaring intisari esensial dan menerjemahkannya ke tindakan nyata.",prompt:"Identify the top 5 actionable takeaways from [book title] and explain how each could be applied in a real-world business scenario."},{title:"Case Studies Deep-Dive",desc:"Studi kasus nyata menjembatani jurang antara teori abstrak dan praktik lapangan. Ekstrak pelajaran dari kasus yang dibahas.",prompt:"Identify any case studies presented in [book title]. Summarize their key points and explain how they support the book's overall message."},{title:"Book Comparison & Dialectic",desc:"Membandingkan dua buku memperlihatkan titik temu dan perdebatan pemikiran para penulis ternama.",prompt:"Compare and contrast the key principles in [book title] with those in [another r
